<title>Tablée</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6EFE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1A17" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Tablée">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tablée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one question per screen. Home = "ce soir"; cooking mode = one step at a time; courses = current aisle open,
   others folded; week = compact grid; progress = three numbers, one curve, one sentence.
   Matière: pâte à modeler (cartes épaisses à rebord), palette de la direction artistique. */
:root{
  --ground:#F6EFE2; --card:#FFFCF6; --edge:#E4D6BF; --ink:#2A2A2E; --muted:#6F695F; --soft:#EFE6D6; --line:#E6DCC9;
  --green:#3F7A2E; --green-edge:#2E5A22; --red:#C8453C; --red-edge:#96332C; --saffron:#E0A21B; --saffron-edge:#A8780F;
  --blue:#2B6CB0; --blue-edge:#1E4D80; --wood:#D9A66B; --onink:#FFFFFF;
  --display:"Fraunces","Iowan Old Style","Georgia",serif; --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --tabh:78px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ground:#1B1A17; --card:#2A2823; --edge:#14130F; --ink:#F2EEE5; --muted:#B0A99B; --soft:#35322B; --line:#3B372E;
    --green:#5FA54B; --red:#D9574D; --saffron:#E8B84A; --blue:#5B8FD6; --onink:#FFFFFF; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ground:#1B1A17; --card:#2A2823; --edge:#14130F; --ink:#F2EEE5; --muted:#B0A99B; --soft:#35322B; --line:#3B372E;
  --green:#5FA54B; --red:#D9574D; --saffron:#E8B84A; --blue:#5B8FD6; --onink:#FFFFFF; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.eyebrow.red{color:var(--red)} .eyebrow.green{color:var(--green)} .eyebrow.blue{color:var(--blue)} .eyebrow.saffron{color:var(--saffron-edge)}
.muted{color:var(--muted)} .hide{display:none !important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tabh) + 120px)}
@media (min-width:900px){ .wrap{max-width:720px} }

/* matière */
.clay{background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--edge),0 12px 24px rgba(42,42,46,.08)}
.clay.sm{border-radius:18px;box-shadow:0 4px 0 var(--edge)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:14px;white-space:nowrap;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.big{min-height:60px;font-size:18px;padding:0 24px;box-shadow:0 6px 0 var(--edge)}
.btn.big:active{box-shadow:0 2px 0 var(--edge)}
.btn.red{background:var(--red);color:var(--onink);box-shadow:0 6px 0 var(--red-edge)} .btn.red:active{box-shadow:0 2px 0 var(--red-edge)}
.btn.green{background:var(--green);color:var(--onink);box-shadow:0 6px 0 var(--green-edge)} .btn.green:active{box-shadow:0 2px 0 var(--green-edge)}
.btn.saffron{background:var(--saffron);color:#2A2A2E;box-shadow:0 4px 0 var(--saffron-edge)} .btn.saffron:active{box-shadow:0 1px 0 var(--saffron-edge)}
.btn.blue{background:var(--blue);color:var(--onink);box-shadow:0 4px 0 var(--blue-edge)} .btn.blue:active{box-shadow:0 1px 0 var(--blue-edge)}
.btn.round{width:44px;height:44px;padding:0;border-radius:50%}
.btn.round.big{width:60px;height:60px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--green);color:var(--onink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);color:#fff;flex:0 0 auto;border:2px solid var(--ground)}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--saffron)}
.seg{height:48px;border-radius:999px;background:var(--soft);padding:4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);text-align:center}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 2px 0 var(--edge);color:var(--ink)}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px}
.brand{font-family:var(--display);font-size:22px;font-weight:700}
.sync{font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on{color:var(--green)} .sync.on::before{background:var(--green)}
.sync.ro{color:var(--saffron-edge)} .sync.ro::before{background:var(--saffron)}
.h1{font-size:clamp(30px,8vw,36px)}

/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--tabh);padding:0 max(8px,env(safe-area-inset-left,0px)) 10px max(8px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);min-height:48px;border-radius:14px}
.tab[aria-current="page"]{color:var(--green)}
.tab.c-saffron[aria-current="page"]{color:var(--saffron-edge)} .tab.c-blue[aria-current="page"]{color:var(--blue)}
body.has-timers .fixedbar{bottom:calc(var(--tabh) + 66px + env(safe-area-inset-bottom,0px))}
body.has-timers .wrap{padding-bottom:calc(var(--tabh) + 180px)}
.timers{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:19;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;pointer-events:none}
.timers::-webkit-scrollbar{display:none}
.timer{pointer-events:auto;flex:0 0 auto;background:var(--ink);color:var(--ground);border-radius:999px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.timer.done{background:var(--red);color:#fff}
.timer b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.timer button{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}

/* accueil */
.hero{padding:16px 16px 16px 18px;display:flex;gap:12px;align-items:stretch}
.hero h2{font-size:25px}
.hero .fig{flex:0 0 auto;align-self:flex-end}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 0 10px;margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-right:20px}
.strip::-webkit-scrollbar{display:none}
.mini{flex:0 0 118px;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:4px}
.mini .nm{font-family:var(--display);font-size:15px;font-weight:700;line-height:1.1}
.mini.off{opacity:.6}

/* cuisine */
.stepcard{padding:18px 18px 18px 20px;display:grid;gap:12px}
.stepcard .txt{font-family:var(--display);font-size:21px;line-height:1.25;font-weight:700}
.tbtn{width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-edge);display:grid;place-items:center;font:700 22px var(--display);flex:0 0 auto}
.tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-edge)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps .num{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:700 14px var(--display)}
.steps li.done .num{background:var(--green);border-color:var(--green);color:var(--onink)}
.steps li.cur .num{background:var(--red);border-color:var(--red);color:#fff}
.steps li.done .t{opacity:.5}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.ing li:first-child{border-top:0}
.box{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center;color:#fff}
.done .box{background:var(--green);border-color:var(--green)}
.done .lab{text-decoration:line-through;color:var(--muted)}
.fixedbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom,0px));z-index:18;transition:bottom .15s;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.fixedbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
@media (min-width:900px){ .fixedbar .in{max-width:720px} }

/* courses */
.item{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 10px;border-top:1px solid var(--line);cursor:pointer}
.item .n{font-size:18px;font-weight:700} .item .q{font-size:13px;color:var(--muted)}
.item.done{opacity:.62} .item.done .n{text-decoration:line-through}
.rayonbtn{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 16px;width:100%}
.rayonbtn .nm{flex:1;font-family:var(--display);font-size:17px;font-weight:700}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0;border:0;border-radius:999px;padding:11px 16px;background:var(--card);box-shadow:0 4px 0 var(--edge)}

/* semaine */
.grid{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:stretch}
.grid .dl{font-family:var(--display);font-size:15px;font-weight:700;align-self:center}
.cell{border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--edge);min-height:62px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;position:relative;text-align:left;width:100%}
.cell .nm{font-size:13px;font-weight:700;line-height:1.15}
.cell .sub{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.cell.empty{background:var(--soft);box-shadow:none;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.cell.skip{background:var(--soft);box-shadow:none;border:2px dashed var(--edge);align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.cell.today{border:2px solid var(--green)}
.cell .lock{position:absolute;top:8px;right:8px;color:var(--saffron-edge)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{min-height:34px;padding:0 12px;background:var(--card);box-shadow:0 2px 0 var(--edge);font-size:13px}
.chips .chip.on{background:var(--green);color:var(--onink);box-shadow:none}

/* feuille (bottom sheet) */
.sheetbg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4);display:grid;align-items:end;justify-items:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:84vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet .handle{width:40px;height:5px;border-radius:999px;background:var(--edge);margin:0 auto}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{display:block;width:100%;padding:10px 4px;border-top:1px solid var(--line)}
.pick b{font-family:var(--display);font-size:16px} .pick small{display:block;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border-radius:999px;background:var(--soft);overflow:hidden}
.stepper button{width:44px;height:40px;display:grid;place-items:center;font-size:20px}
.stepper span{min-width:28px;text-align:center;font-weight:700}

/* progrès */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{padding:14px 12px 12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:32px;line-height:1;color:var(--blue)}
.kpi b small{font-size:16px;color:var(--muted)}
.kpi span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* premier lancement, réglages */
.onb{display:grid;gap:14px}
.member{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 12px 0 14px}
.member input{flex:1;min-width:0;border:0;background:transparent;font-weight:600;font-size:17px}
.member .flag{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.dash{min-height:52px;border:2px dashed var(--edge);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);width:100%}
.days{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;font-size:12px;text-align:center;align-items:center}
.days .lab{text-align:left;font-weight:700}
.days input{width:22px;height:22px;accent-color:var(--green)}
.field{display:grid;gap:6px} .field label{font-weight:700;font-size:14px}
.field input[type=text],.field input[type=number],.field select,.field textarea{border:0;border-radius:14px;padding:11px 14px;background:var(--card);box-shadow:0 4px 0 var(--edge);width:100%}
.cuis{display:flex;flex-wrap:wrap;gap:6px}
.cuis button{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;background:var(--card);box-shadow:0 2px 0 var(--edge)}
.cuis button[data-w="0"]{opacity:.45;text-decoration:line-through}
.cuis button[data-w="3"]{background:var(--green);color:var(--onink);box-shadow:none}
.prog{display:flex;gap:6px} .prog i{width:28px;height:6px;border-radius:999px;background:var(--edge);display:inline-block} .prog i.on{background:var(--green)}

/* ---------- v3 : couleurs, vignettes, cuisine en liste ---------- */
.toast{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto;max-width:calc(100% - 40px);text-align:center;animation:toastin .18s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.timer span.lb{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onb{padding-bottom:calc(var(--tabh) + 170px)}
.emo{flex:0 0 auto;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:23px;line-height:1;background:var(--soft);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.emo img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.emo.sm{width:30px;height:30px;font-size:18px;border-radius:10px}
.item .emo{margin-left:-2px}
.item.done .emo{filter:grayscale(.7);opacity:.6}
.rayonbtn .rdot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.ing li .emo{margin-top:-4px}
.cz-head{display:flex;align-items:center;gap:10px;margin-top:22px}
.cz-head .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--display);background:var(--ink);color:var(--ground);flex:0 0 auto}
.cz-head h2{font-size:21px;flex:1}
.cz-ok{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:10px;width:100%}
.cz-ok b{flex:1}
.cz-prog{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;display:flex;margin-top:10px}
.cz-prog i{display:block;height:100%;background:var(--green)}
.cz-prog i.enc{background:var(--saffron)}
.st2{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.st2.locked{opacity:.42;filter:saturate(.4)}
.st2 li{background:var(--card);border-radius:20px;box-shadow:0 4px 0 var(--edge);padding:12px 14px 12px 12px;border:2px solid transparent;transition:border-color .15s,background .15s}
.st2 li.enc{border-color:var(--mc,var(--saffron));background:color-mix(in srgb,var(--mc,var(--saffron)) 9%,var(--card))}
.st2 li.done{opacity:.6}
.st2 li.done .tx{text-decoration:line-through;text-decoration-thickness:1px}
.st2 .hd{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%}
.st2 .bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 15px var(--display);background:var(--card)}
.st2 li.done .bub{background:var(--green);border-color:var(--green);color:#fff}
.st2 li.enc .bub{background:var(--mc,var(--saffron));border-color:var(--mc,var(--saffron));color:#fff;font:700 12px var(--body)}
.st2 .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.st2 .tg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft)}
.st2 .tg.din{background:#F5D9D5;color:#8E2E27} .st2 .tg.boi{background:#D8E6F5;color:#1E4D80}
.st2 .tx{font-size:16px;line-height:1.38;font-weight:600}
.st2 .qui{margin-top:6px;font-size:13px;font-weight:700;color:var(--mc,var(--saffron-edge))}
.st2 .det{margin-top:12px;display:grid;gap:10px}
.st2 .btns{display:flex;flex-wrap:wrap;gap:8px}
.st2 .btns .btn{min-height:40px;font-size:13px}
.illu{position:relative;border-radius:18px;aspect-ratio:16/10;overflow:hidden;display:grid;place-items:center;background:radial-gradient(120% 100% at 30% 20%,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 70%,#fff))}
.illu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.illu .e1{font-size:76px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12));animation:bob 2.4s ease-in-out infinite}
.illu .e2{position:absolute;right:16%;bottom:14%;font-size:44px;animation:bob 2.4s ease-in-out .6s infinite}
.illu .lab{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);color:#2A2A2E;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){ .illu .e1,.illu .e2{animation:none} }
.pk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

function spoon(q){ if(q<=2) return "1 pincée"; if(q<=6) return "1 c. à c."; if(q<=11) return "2 c. à c."; if(q<=20) return "1 c. à s."; return Math.round(q/15)+" c. à s."; }
function fmtQty(q,unite,ing){

  if(unite==="g"){ if(placard&&q<30) return spoon(q); return Math.max(5,Math.round(q/5)*5)+" g"; }
  return frac(q)+" "+unite; }
function plur(nom,n){ if(n<=1) return nom; var w=nom.split(" "); if(w.length===1&&/^[a-zéèêôûî]+$/i.test(nom)) return nom+"s"; if(w.length>1&&/^[a-zéèêôûî]+$/i.test(w[0])&&(w[1]==="de"||w[1]==="ou"||w[1][0]==="(")) { w[0]=w[0]+"s"; return w.join(" "); } return nom; }

var LS="tablee:";
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(LS+k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k,JSON.stringify(v)); }catch(e){} }
var listeners={};
function subscribe(path,cb){ cb(lsGet(path)); if(!S.db) return; var timer=setTimeout(function(){ setSync("lent"); },10000);
  S.db.doc(path).onSnapshot(function(snap){ clearTimeout(timer); var d=snap.exists?snap.data():null; if(!snap.metadata.fromCache) setSync(S.ro?"ro":"on"); if(d) lsSet(path,d); cb(d); },
    function(err){ clearTimeout(timer); setSync(err.code==="revoked"?"off":"erreur"); }); }
function save(path,data){ lsSet(path,data); listeners[path]&&listeners[path](data); if(!S.db) return Promise.resolve();
  return S.db.doc(path).set(data).catch(function(e){ if(e.code==="invalid_argument"){ S.ro=true; setSync("ro"); if(!S.roToast){ S.roToast=true; toast("Lecture seule sur ce compte : tes modifications restent sur cet appareil."); } } else toast("Pas pu enregistrer : "+e.code); }); }
function merge(path,patch,current){ var next=deepMerge(current||lsGet(path)||{},patch); lsSet(path,next); listeners[path]&&listeners[path](next); if(!S.db) return Promise.resolve();
  return S.db.doc(path).update(patch).catch(function(e){ if(e.code==="invalid_argument") return S.db.doc(path).set(next).catch(function(){ S.ro=true; setSync("ro"); }); toast("Pas pu enregistrer : "+e.code); }); }

/* ====================== partage entre appareils (sans compte Claude) ====================== */
/* Un "code de partage" = base64 de {u: url Supabase, k: clé anon, f: code du foyer}. Même code sur chaque appareil. */
function partageCfg(){ return lsGet("partage")||null; }
function codePartage(cfg){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify({u:cfg.url,k:cfg.key,f:cfg.foyer})))).replace(/=+$/,""); }catch(e){ return ""; } }
function lireCodePartage(code){ try{ var o=JSON.parse(decodeURIComponent(escape(atob(code.trim().replace(/\s+/g,""))))); if(o&&o.u&&o.k&&o.f) return {url:o.u,key:o.k,foyer:o.f}; }catch(e){} return null; }
function chargerScript(src){ return new Promise(function(res,rej){ if(window.supabase) return res(); var s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function dbSupabase(cfg){
  var client=window.supabase.createClient(cfg.url,cfg.key,{realtime:{params:{eventsPerSecond:5}}});
  var T="tablee_docs"; var subs={}; var channel=null;
  function abonner(){ if(channel) return; channel=client.channel("foyer-"+cfg.foyer)
    .on("postgres_changes",{event:"*",schema:"public",table:T,filter:"foyer=eq."+cfg.foyer},function(payload){ var row=payload.new||payload.old; if(!row||!subs[row.path]) return; var d=payload.eventType==="DELETE"?null:row.data; subs[row.path].forEach(function(cb){ cb({exists:!!d,data:function(){return d;},metadata:{fromCache:false}}); }); })
    .subscribe(function(st){ if(st==="CHANNEL_ERROR"||st==="TIMED_OUT") setSync("erreur"); }); }
  return { doc:function(path){ return {
    onSnapshot:function(cb,onErr){ (subs[path]=subs[path]||[]).push(cb); abonner();
      client.from(T).select("data").eq("foyer",cfg.foyer).eq("path",path).maybeSingle().then(function(r){ if(r.error){ onErr&&onErr({code:r.error.code||"erreur"}); return; } var d=r.data?r.data.data:null; cb({exists:!!d,data:function(){return d;},metadata:{fromCache:false}}); },function(e){ onErr&&onErr({code:"erreur"}); }); },
    set:function(data){ return client.from(T).upsert({foyer:cfg.foyer,path:path,data:data,updated_at:new Date().toISOString()},{onConflict:"foyer,path"}).then(function(r){ if(r.error) throw {code:r.error.code||"erreur"}; }); },
    update:function(patch){ var self=this; return client.from(T).select("data").eq("foyer",cfg.foyer).eq("path",path).maybeSingle().then(function(r){ var cur=r.data?r.data.data:{}; return self.set(deepMerge(cur||{},patch)); }); }
  }; } };
}
async function connecterPartage(){
  if(window.claude&&window.claude.use){ try{ var r2=await Promise.all([claude.use("db"),claude.use("user")]); if(r2[1]){ try{ S.user=await r2[1].me(); var can=await r2[1].can("data.write"); if(can===false) S.ro=true; }catch(e){} } return r2[0]; }catch(e){} }
  var cfg=partageCfg(); if(!cfg) return null;
  try{ await chargerScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"); return dbSupabase(cfg); }
  catch(e){ setSync("erreur"); toast("Partage indisponible pour l'instant (hors ligne ?). Les données restent sur cet appareil."); return null; }
}

  h.push('</section>'); return h.join(""); }

function pageSemaine(){ var w=S.semaine, cfg=S.cfg; var h=['<div class="wrap">'];
  var hist=(S.hist&&S.hist.semaines)||[]; var ids=hist.map(function(s){return s.id;}); if(w) ids.push(w.id); ids=ids.filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
  var view=S.ui.weekView||(w?w.id:ids[ids.length-1]); var vi=ids.indexOf(view); var isCur=w&&view===w.id;
  var repas=[]; if(isCur) repas=w.repas; else repas=((S.hist&&S.hist.entrees)||[]).filter(function(e){return e.semaine===view;}).map(function(e){ return {id:e.date+"-"+e.creneau,date:e.date,creneau:e.creneau,recipe:e.recipe,convives:e.convives||0,veille:!!e.veille,verrou:false,skip:false,cuisine:!!e.cuisine}; });

  h.push('<div class="row"><button class="btn round" data-action="week-nav" data-d="-1" aria-label="Semaine précédente" '+(vi<=0?"disabled":"")+'>'+ic("back")+'</button><div style="flex:1;text-align:center;min-width:0"><p class="eyebrow '+(isCur?(w.statut==="validee"?"green":"saffron"):"")+'">'+(isCur?(w.statut==="validee"?"Validée":"Brouillon"):"Passée")+' · '+st.prevus+' repas</p><h1 style="font-size:22px">Du '+(d0.getDate()===1?"1er":d0.getDate())+' '+(d0.getMonth()!==addDays(d0,6).getMonth()?MOIS[d0.getMonth()]+" ":"")+'au '+fmtDate(addDays(d0,6)).replace(/^\S+\s/,"")+'</h1></div><button class="btn round" data-action="week-nav" data-d="1" aria-label="Semaine suivante" '+(vi>=ids.length-1&&!(isCur&&w.statut==="validee")?"disabled":"")+'>'+ic("next")+'</button></div>');
  if(isCur){ var F=[["tous","Tous"],["rapide","Rapide"],["vege","Végé"],["Asie","Asie"],["Europe","Europe"],["Amérique","Amériques"],["frigo","Frigo"]];
    h.push('<div class="chips" style="margin-top:12px">'+F.map(function(f){ return '<button class="chip'+(S.ui.filtre===f[0]||(f[0]==="frigo"&&S.ui.frigo)?" on":"")+'" data-action="filtre" data-f="'+f[0]+'">'+f[1]+'</button>'; }).join("")+'</div>');
    if(S.ui.filtre==="frigo") h.push('<div class="addline" style="margin-top:8px"><input id="frigo" type="text" placeholder="Ce que j\'ai dans le frigo : courgettes, poulet…" value="'+esc(S.ui.frigo)+'"><button class="btn" data-action="frigo-ok">OK</button></div>');
    if(S.ui.filtre!=="tous"&&S.ui.filtre!=="frigo") h.push('<p class="muted" style="font-size:13px;margin-top:6px">Le filtre s\'applique à Remplacer et à Régénérer.</p>'); }
  h.push('<div class="grid" style="margin-top:12px"><span></span><span class="eyebrow" style="padding-left:10px">Midi · '+cfg.convivesMidi+'</span><span class="eyebrow" style="padding-left:10px">Soir · '+cfg.convivesSoir+'</span>');
  var td=iso(today());
  for(var i=0;i<7;i++){ var d=addDays(d0,i), ds=iso(d); h.push('<span class="dl">'+JOURS_3[d.getDay()]+'</span>'); ["midi","soir"].forEach(function(cr){ var m=repas.filter(function(x){return x.date===ds&&x.creneau===cr;})[0]; h.push(cellMeal(m,ds===td,isCur)); }); }
  h.push('</div>');
  h.push('<div class="row" style="margin-top:14px;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap">'+Object.keys(CONT).filter(function(k){return k!=="Maison"&&k!=="Moyen-Orient";}).map(function(k){ return '<span class="row" style="gap:5px"><span class="dot" style="background:'+CONT[k]+'"></span>'+(k==="Afrique"?"Afrique, Moyen-Orient":k==="Amérique"?"Amériques":k)+'</span>'; }).join("")+(isCur?'<span style="font-weight:700">Un tap sur un plat : remplacer, choisir, verrouiller, sauter.</span>':'')+'</div>');
  if(isCur){ if(w.statut!=="validee") h.push('<div class="fixedbar"><div class="in"><button class="btn big" style="flex:1" data-action="generer">Régénérer</button><button class="btn big green" style="flex:1.4" data-action="valider">Valider la semaine</button></div></div>');
    else h.push('<div class="fixedbar"><div class="in"><button class="btn big" style="flex:1" data-action="deverrouiller">Modifier</button><button class="btn big green" style="flex:1.4" data-action="nouvelle-semaine">Semaine suivante</button></div></div>'); }
  h.push('</div>'+tabs("semaine")); return h.join(""); }
function cellMeal(m,isToday,editable){ if(!m) return '<div class="cell empty">Libre</div>';
  if(m.skip) return editable?'<button class="cell skip" data-action="meal" data-id="'+m.id+'">Sauté</button>':'<div class="cell skip">Sauté</div>';

  var inner='<span class="nm">'+esc(r.nom.split(",")[0])+'</span><span class="sub"><span class="dot" style="background:'+contColor(r)+'"></span>'+esc(r.cuisine)+(m.veille?' · veille':'')+(m.cuisine?' · fait':'')+'</span>'+(m.verrou?'<span class="lock">'+ic("lock").replace('width="22" height="22"','width="14" height="14"')+'</span>':'');
  return editable?'<button class="cell'+(isToday?" today":"")+'" data-action="meal" data-id="'+m.id+'">'+inner+'</button>':'<div class="cell'+(isToday?" today":"")+'">'+inner+'</div>'; }

function pageProgres(){ var w=S.semaine, st=w?statsSemaine(w.repas):{prevus:0,cuits:0,score:0}; var hist=(S.hist&&S.hist.semaines)||[]; var pts=hist.slice(); if(w&&st.cuits) pts.push({id:w.id,prevus:st.prevus,cuits:st.cuits,score:st.score});
  var h=['<div class="wrap">','<div class="top" style="align-items:flex-end"><div><p class="eyebrow">'+(w?"Semaine du "+fmtDate(fromIso(w.debut)):"Progrès")+'</p><h1 class="h1">Progrès</h1></div></div>'];
  h.push('<div class="kpis" style="margin-top:8px"><div class="clay sm kpi"><b>'+st.cuits+'<small>/'+st.prevus+'</small></b><span>repas tenus</span></div><div class="clay sm kpi"><b>'+(st.score||"–")+'</b><span>score santé</span></div><div class="clay sm kpi"><b>'+hist.length+'</b><span>semaines</span></div></div>');
  h.push('<section class="clay" style="margin-top:14px;padding:16px 18px 12px"><div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="font-size:18px">Score santé par semaine</h2><span class="muted" style="font-size:12px">'+(pts.length<2?"dès la deuxième semaine":pts.length+" semaines")+'</span></div>'+courbe(pts)+'</section>');
  h.push('<p style="margin-top:16px;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25">'+esc(bilan(st,hist))+'</p>');
  var pd=lsGet("poids")||[]; var last=pd[pd.length-1], first=pd[0]; var delta=last&&first&&pd.length>1?(last.kg-first.kg):null;
  h.push('<section class="clay sm" style="margin-top:16px;padding:14px 18px;display:grid;gap:10px"><div class="row" style="gap:12px"><div style="flex:1;min-width:0"><p class="eyebrow">Mon poids · reste sur cet appareil</p><p style="margin-top:4px;font-family:var(--display);font-size:22px;font-weight:700">'+(last?String(last.kg).replace(".",",")+' kg':'Pas encore saisi')+(delta!=null?' <span class="muted" style="font-size:14px;font-family:var(--body);font-weight:600">'+(delta>0?"+":"")+String(Math.round(delta*10)/10).replace(".",",")+' kg depuis le '+fmtDate(fromIso(first.date))+'</span>':'')+'</p></div><button class="btn blue" data-action="poids-toggle">Saisir</button></div>'+(S.ui.poidsOpen?'<div class="addline"><input id="poids" type="number" step="0.1" min="20" max="300" placeholder="72,4"><button class="btn blue" data-action="poids-ok">OK</button></div>':'')+'</section>');
  h.push('</div>'+tabs("progres")); return h.join(""); }
function courbe(pts){ if(!pts.length) return '<p class="muted" style="font-size:14px;margin-top:8px">La courbe se dessine à partir des semaines faites. Coche « Soirée faite » en cuisinant.</p>';
  var W=320,H=150,L=36,R=16,T=16,B=30; var n=pts.length; var xs=pts.map(function(p,i){ return n===1?W/2:L+(W-L-R)*i/(n-1); }); var ys=pts.map(function(p){ return T+(H-T-B)*(1-Math.max(0,Math.min(100,p.score))/100); });
  var path=xs.map(function(x,i){ return (i?"L":"M")+x+" "+ys[i]; }).join(" "); var area=n>1?path+" L"+xs[n-1]+" "+(H-B)+" L"+xs[0]+" "+(H-B)+" Z":"";
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="150" role="img" aria-label="Score santé par semaine : '+pts.map(function(p){return p.score;}).join(", ")+'" style="display:block;margin-top:8px">'+
    [100,75,50].map(function(v){ var y=T+(H-T-B)*(1-v/100); return '<path d="M'+L+' '+y+'H'+(W-R)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Figtree,system-ui,sans-serif">'+v+'</text>'; }).join("")+
    (area?'<path d="'+area+'" fill="var(--blue)" opacity="0.12"/>':'')+'<path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map(function(p,i){ var lastp=i===n-1; return '<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="'+(lastp?7:5)+'" fill="'+(lastp?"var(--blue)":"var(--card)")+'" stroke="var(--blue)" stroke-width="3"/>'+(lastp?'<text x="'+xs[i]+'" y="'+(ys[i]-12)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--blue)" font-family="Fraunces,Georgia,serif">'+p.score+'</text>':'')+'<text x="'+xs[i]+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Figtree,system-ui,sans-serif">'+fmtDate(fromIso(p.id)).replace(/^\S+\s/,"")+'</text>'; }).join("")+'</svg>'; }
function bilan(st,hist){ if(!st.prevus) return "Rien de prévu cette semaine."; if(!st.cuits) return "Aucun repas coché pour l'instant. « Soirée faite » est en bas du mode cuisine.";
  var last=hist.length?hist[hist.length-1]:null; var s=st.cuits+" repas sur "+st.prevus+" cuisinés";
  if(last&&last.score&&st.score) s+= st.score>last.score?", score en hausse par rapport à la semaine dernière.":st.score<last.score?", score un peu plus bas que la semaine dernière.":", même score que la semaine dernière."; else s+="."; return s; }

/* ---------- premier lancement & réglages ---------- */
function cuisinesConnues(){ var set={}; S.REC.forEach(function(r){ if(r.creneau.indexOf("encas")<0) set[r.cuisine]=1; }); return Object.keys(set).sort(); }
function draft(){ if(!S.ui.draft) S.ui.draft=JSON.parse(JSON.stringify(S.cfg)); if(!S.ui.draft.membres.length) S.ui.draft.membres=[{id:uid(),nom:"",couleur:COULEURS[0],soirSeulement:false}]; return S.ui.draft; }
function stepMembres(c){ return '<h1 class="h1">Qui est à table ?</h1><p class="muted" style="margin-top:8px;font-size:15px">Un prénom par personne. Chacun aura sa figurine, pour savoir qui coche et qui cuisine.</p><div class="stack" style="margin-top:16px">'+
  c.membres.map(function(m,i){ return '<div class="clay sm member"><span class="av" style="background:'+m.couleur+';border:0;width:36px;height:36px">'+esc(ini(m.nom)||"?")+'</span><label for="mem'+i+'" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Prénom</label><input id="mem'+i+'" type="text" value="'+esc(m.nom)+'" placeholder="Prénom" data-mem="'+i+'" autocomplete="off"><button class="flag" data-action="mem-moi" data-i="'+i+'" style="'+(lsGet("moi")===m.id?"color:var(--green)":"")+'">'+(lsGet("moi")===m.id?"c'est moi":"moi ?")+'</button><button class="flag" data-action="mem-soir" data-i="'+i+'" style="'+(m.soirSeulement?"color:var(--blue)":"")+'">'+(m.soirSeulement?"le soir seulement":"midi et soir")+'</button><button class="btn round" style="min-height:36px;width:36px;height:36px;box-shadow:none;background:var(--soft)" data-action="mem-del" data-i="'+i+'" aria-label="Retirer">'+ic("x")+'</button></div>'; }).join("")+
  '<button class="dash" data-action="mem-add">'+ic("plus")+'Ajouter quelqu\'un</button></div>'; }
function stepRepas(c){ var nm=c.membres.filter(function(m){return m.nom&&!m.soirSeulement;}).length, ns=c.membres.filter(function(m){return m.nom;}).length;
  return '<h1 class="h1">Quels repas on cuisine ?</h1><p class="muted" style="margin-top:8px;font-size:15px">« Midi la veille » : les boîtes du midi se préparent le soir d\'avant, avec le dîner.</p><section class="clay" style="margin-top:16px;padding:14px 16px"><div class="days"><span></span>'+JOURS_C.map(function(j){return '<span>'+j+'</span>';}).join("")+['midi','soir','veille'].map(function(k){ return '<span class="lab">'+(k==="veille"?"Midi la veille":k==="midi"?"Midi":"Soir")+'</span>'+c.jours.map(function(j,d){ return '<input type="checkbox" data-jour="'+d+'" data-k="'+k+'" aria-label="'+k+' '+JOURS[d]+'" '+(j[k]?"checked":"")+'>'; }).join(""); }).join("")+'</div></section>'+
  '<div class="row" style="margin-top:14px;gap:10px;align-items:stretch"><div class="field" style="flex:1"><label for="cMidi">Convives le midi</label><input id="cMidi" type="number" min="1" max="12" value="'+(c.convivesMidi||nm||4)+'"></div><div class="field" style="flex:1"><label for="cSoir">Convives le soir</label><input id="cSoir" type="number" min="1" max="12" value="'+(c.convivesSoir||ns||4)+'"></div></div>'+
  '<div class="row" style="margin-top:14px;gap:10px;align-items:stretch"><div class="field" style="flex:1"><label for="tempsMax">Temps max le soir (min)</label><input id="tempsMax" type="number" min="15" max="120" step="5" value="'+c.tempsMax+'"></div><div class="field" style="flex:1"><label for="debut">Début de semaine</label><select id="debut"><option value="0" '+(c.debut===0?"selected":"")+'>Dimanche</option><option value="1" '+(c.debut===1?"selected":"")+'>Lundi</option></select></div></div>'; }
function stepObjectif(c){ return '<h1 class="h1">Quel objectif ?</h1><p class="muted" style="margin-top:8px;font-size:15px">Il règle les portions de féculents et le choix des plats.</p><div class="stack" style="margin-top:16px">'+Object.keys(OBJ).map(function(k){ return '<button class="clay sm" style="padding:14px 16px;display:flex;align-items:center;gap:12px;width:100%'+(c.objectif===k?';outline:3px solid var(--green)':'')+'" data-action="obj" data-k="'+k+'"><span class="box" style="margin:0;'+(c.objectif===k?'background:var(--green);border-color:var(--green)':'')+'">'+(c.objectif===k?ic("check"):"")+'</span><span style="font-weight:700;font-size:16px">'+OBJ[k]+'</span></button>'; }).join("")+'</div>'+
  '<p class="eyebrow" style="margin-top:18px">Cuisines</p><p class="muted" style="font-size:13px">Un tap : normal → favori → exclu.</p><div class="cuis" style="margin-top:8px">'+cuisinesConnues().map(function(k){ var w=c.cuisines[k]; w=(w==null?1:w); return '<button type="button" data-action="cuis" data-k="'+esc(k)+'" data-w="'+w+'">'+esc(k)+(w===3?" ★":"")+'</button>'; }).join("")+'</div>'+
  '<div class="field" style="margin-top:16px"><label for="exclusions">À exclure (allergies, dégoûts)</label><textarea id="exclusions" rows="2" placeholder="ex. crevettes, coriandre, porc">'+esc(c.exclusions||"")+'</textarea></div>'; }
function pageOnboarding(){ var c=draft(); var step=S.ui.onb; var h=['<div class="wrap onb">','<div class="row" style="justify-content:space-between"><span class="brand">Tablée</span><div class="prog" aria-label="Étape '+(step+1)+' sur 3">'+[0,1,2].map(function(i){return '<i class="'+(i<=step?"on":"")+'"></i>';}).join("")+'</div></div>'];
  if(step===0) h.push('<div style="display:flex;justify-content:center">'+figurine("#4F8F3A",120)+'</div>'+stepMembres(c)); else if(step===1) h.push(stepRepas(c)); else h.push(stepObjectif(c));

  h.push(sectionPartage());

    o.innerHTML='<div class="sheetbg" data-action="sheet-close"><div class="sheet" data-stop="1"><span class="handle"></span><p class="eyebrow">'+cap(fmtDateLong(d))+' · '+m.creneau+(m.veille?' · préparé la veille':'')+'</p><h2 style="font-size:22px">'+(r?esc(r.nom):m.skip?"Repas sauté":"Aucun plat")+'</h2>'+(r?'<p class="muted" style="font-size:14px">'+esc(r.pourquoi)+'</p><div class="row" style="gap:6px;flex-wrap:wrap"><span class="chip">'+esc(r.cuisine)+'</span><span class="chip">'+r.temps_total+' min</span><span class="chip">Santé '+r.sante+'</span></div>':'')+
